server:
  port: 8085

spring:
  application:
    name: servico-login

  datasource:
    url: jdbc:h2:mem:logindb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # TODOS os servicos usam o mesmo segredo (o servicoLogin emite, os outros validam)
    secret: "G7vQ2mX9kL4pN8sR1dF6wT3yH0cJ5zA8uE2bV7nM9qS4xK6rP1tW8yD3fL0gC5"
    expiration-ms: 7200000
  # origens do front end liberadas no CORS (separadas por virgula)
  cors:
    origins: "http://localhost:8081,http://localhost:3000,http://localhost:4200,http://localhost:5173"
  # usuarios criados automaticamente quando o servico sobe
  admin:
    nome: "Administrador"
    email: "admin@lanchonete.com"
    senha: "admin123"
  cozinha:
    nome: "Cozinha"
    email: "cozinha@lanchonete.com"
